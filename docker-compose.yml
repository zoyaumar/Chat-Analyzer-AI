# Option A (three services): db + api + web.
# The browser talks only to `web` (nginx), which serves the SPA and proxies
# API/WebSocket traffic to `api` — single origin (docs/design_decisions.md).
#
# Usage:
#   cp .env.example .env   # set SECRET_KEY
#   docker compose up --build
#   http://localhost:8080

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat_analyzer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat_analyzer"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://chat:chat@db:5432/chat_analyzer
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (see .env.example)}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      # Load the models at boot rather than inside the first request.
      AI_WARMUP_ON_STARTUP: ${AI_WARMUP_ON_STARTUP:-true}
      # HuggingFace caches under $HF_HOME; on a volume it survives a redeploy,
      # so the weights are downloaded once instead of on every start.
      HF_HOME: /cache/huggingface
    volumes:
      - huggingface:/cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    # Not published: only `web` reaches it, on the Compose network.
    # Memory: both models plus the torch runtime are resident in this one
    # process, so the limit is set from a measured peak with headroom
    # for the transient allocations of an in-flight summary. Exceeding it is a
    # kill, so this is deliberately above the measured peak rather than at it.
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-2g}

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  huggingface: