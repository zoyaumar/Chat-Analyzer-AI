[project]
name = "chat-analyzer-ai"
version = "0.1.0"
description = "Realtime chat application with AI-powered message analysis"
requires-python = ">=3.11"
# Runtime dependencies live in the pinned requirements.txt (decision Q15).

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Non-strict static analysis baseline (gap T3): full type checking of the
# annotated code, untyped third-party imports tolerated.
[tool.mypy]
python_version = "3.11"
files = ["chat_backend", "tests", "alembic"]
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true
check_untyped_defs = true