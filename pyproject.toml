[project]
name = "chat-analyzer-ai"
version = "0.1.0"
description = "Realtime chat application with AI-powered message analysis"
requires-python = ">=3.11"
# Runtime dependencies live in the pinned requirements.txt (decision Q15).

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]