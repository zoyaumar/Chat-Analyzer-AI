# Serves the built SPA and reverse-proxies API/WebSocket paths to `api:8000`.
# Prefix locations are deliberate: `/analytics` is an SPA route while
# `/analytics/...` is an API route, so only the latter is proxied.
server {
    listen 80;
    server_name _;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json;

    root /usr/share/nginx/html;
    index index.html;

    # --- Headers shared by every API proxy (server-level: inherited) ---
    # The official nginx image has no proxy_params include, so they live here.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- API (prefix matches keep SPA routes like /analytics intact) ---
    location ^~ /users/     { proxy_pass http://api:8000; }
    location ^~ /messages/  { proxy_pass http://api:8000; }
    location ^~ /analytics/ { proxy_pass http://api:8000; }
    location ^~ /health     { proxy_pass http://api:8000; }
    location ^~ /docs       { proxy_pass http://api:8000; }
    location ^~ /redoc      { proxy_pass http://api:8000; }
    location = /openapi.json { proxy_pass http://api:8000; }

    # --- WebSocket ---
    location ^~ /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # --- SPA (history fallback) ---
    location / {
        try_files $uri $uri/ /index.html;

        # Browser hardening for the SPA (gap S11). Deliberately inside this
        # location: proxied API responses must keep only the headers FastAPI
        # sets, or Swagger's CSP would be intersected with this one and break.
        # The meta tag in index.html is the weaker dev-time baseline; where
        # both apply, both are enforced.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
