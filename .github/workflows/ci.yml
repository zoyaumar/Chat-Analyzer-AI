name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff, migrations, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat
          POSTGRES_DB: chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://chat:chat@localhost:5432/chat_test
      SECRET_KEY: ci-test-secret-key-0123456789-0123456789
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check chat_backend tests alembic
      - name: Type-check
        run: mypy
      # Reports, but does not gate yet. Everything the pins control
      # now audits clean — fastapi/starlette, python-multipart, python-dotenv
      # were all moved off their advisories. What is left is `transformers
      # 4.53.0`: 12 advisories, 9 of which have no fixed release at all and 3
      # of which are only fixed in the 5.x line (a major bump this suite's
      # model fixtures would have to be re-validated against, with the AI
      # evaluation suite as the safety net). Until that migration happens, this step
      # lists the remainder so it cannot grow unnoticed.
      - name: Audit dependencies
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit
      - name: Apply migrations to a fresh database
        run: alembic upgrade head
      - name: Test
        run: pytest

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks needs the full history, not the single-commit checkout,
          # or a secret introduced and deleted in one PR would slip through.
          fetch-depth: 0
      - name: Scan the working tree and the full history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
        with:
          version: v8.30.1
      - name: Re-scan the working tree
        # `gitleaks-action` only inspects committed history. This catches an
        # untracked file that is about to be committed (a stray .env, a
        # pasted key in a scratch script) before it lands.
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks dir . --redact

  frontend:
    name: Frontend (lint, type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat_frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chat_frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Type-check + build
        run: npm run build
