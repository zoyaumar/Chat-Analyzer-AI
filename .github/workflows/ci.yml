name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff, migrations, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat
          POSTGRES_DB: chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://chat:chat@localhost:5432/chat_test
      SECRET_KEY: ci-test-secret-key-0123456789-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check chat_backend tests alembic
      - name: Type-check
        run: mypy
      # Reports, but does not gate yet (gap O12). The pins in requirements.txt
      # carry known advisories — `transformers 4.53.0` and `starlette 0.47.3`
      # (via `fastapi 0.116.1`) — and clearing them is a coordinated upgrade,
      # tracked as gap D8 with the A7 evaluation fixtures as the safety net.
      # It runs here so the list can be seen and cannot grow unnoticed.
      - name: Audit dependencies (gap O12)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit
      - name: Apply migrations to a fresh database
        run: alembic upgrade head
      - name: Test
        run: pytest

  frontend:
    name: Frontend (lint, type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chat_frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies (gap O12)
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Type-check + build
        run: npm run build
